services:
  braquage-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: braquage-game-manager
    ports:
      - "3001:3000"
    volumes:
      # Mount project directory to /data
      - .:/data
      # Use container's node_modules and .next (anonymous volumes)
      - /data/node_modules
      - /data/.next
    working_dir: /data
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
