services:
  braquage-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: braquage-game-manager
    ports:
      - "3001:3000"
    volumes:
      # Mount the project directory directly to /app to avoid duplication
      - .:/app
      # Use container's node_modules and .next (anonymous volumes)
      - /app/node_modules
      - /app/.next
    working_dir: /app
    environment:
      - NODE_ENV=production
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
