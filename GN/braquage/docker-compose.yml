services:
  braquage-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: braquage-game-manager
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    # Keep container running for debugging
    command: tail -f /dev/null
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
