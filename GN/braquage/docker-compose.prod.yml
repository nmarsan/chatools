services:
  braquage-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: braquage-game-manager
    ports:
      - "3001:3000"
    volumes:
      # Mount external directory for game sessions data
      # Change this path to your desired location
      - /data/www/chatools/GN/braquage/game-sessions:/app/data/game-sessions
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

